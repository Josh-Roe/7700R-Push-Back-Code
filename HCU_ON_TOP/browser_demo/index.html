<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Autonomous Selector Demo</title>
  <style>
    :root {
      --bg: #111111;
      --panel: #1e1e1e;
      --border: #3a3a3a;
      --selected: #2e8b57;
      --confirmed: #3a6ea5;
      --disabled: #777777;
      --text: #f2f2f2;
      --muted: #c7c7c7;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: #0c0c0c;
      color: var(--text);
      font: 16px/1.4 Arial, sans-serif;
      display: grid;
      place-items: center;
      min-height: 100vh;
    }
    .frame {
      width: 980px;
      max-width: calc(100vw - 24px);
      padding: 16px;
      background: var(--bg);
      border-radius: 14px;
      box-shadow: 0 12px 40px rgba(0,0,0,.35);
    }
    .title {
      margin: 0 0 12px;
      font-size: 20px;
      font-weight: 700;
    }
    .brain {
      display: grid;
      grid-template-columns: 220px 1fr;
      gap: 12px;
      height: 520px;
    }
    .panel {
      background: var(--panel);
      border: 2px solid var(--border);
      border-radius: 10px;
      padding: 12px;
    }
    .pose h2, .list h2 {
      margin: 0 0 12px;
      font-size: 20px;
    }
    .pose-line {
      margin: 6px 0;
      font-size: 18px;
    }
    .confirm-wrap {
      margin-top: 28px;
    }
    button {
      width: 100%;
      height: 48px;
      border: 0;
      border-radius: 10px;
      background: var(--selected);
      color: white;
      font-size: 18px;
      font-weight: 700;
      cursor: pointer;
    }
    button:disabled {
      background: var(--disabled);
      cursor: not-allowed;
    }
    .status {
      margin-top: 12px;
      color: var(--muted);
      min-height: 44px;
    }
    .list-box {
      overflow-y: auto;
      height: calc(100% - 36px);
      padding-right: 4px;
    }
    .item {
      width: 100%;
      margin-bottom: 10px;
      padding: 12px;
      border-radius: 10px;
      border: 0;
      background: #303030;
      color: white;
      text-align: center;
      font-size: 17px;
    }
    .item.selected { background: var(--selected); }
    .item.confirmed { background: var(--confirmed); }
    .item:disabled { opacity: 1; cursor: not-allowed; }
    .footer { margin-top: 12px; color: #bbbbbb; font-size: 14px; }
  </style>
</head>
<body>
  <div class="frame">
    <h1 class="title">Autonomous Selector Browser Demo</h1>
    <div class="brain">
      <div class="panel pose">
        <h2>Robot Pose</h2>
        <div class="pose-line" id="x">X: 0.00</div>
        <div class="pose-line" id="y">Y: 0.00</div>
        <div class="pose-line" id="theta">Theta: 0.00</div>
        <div class="confirm-wrap">
          <button id="confirmBtn">Confirm</button>
          <div class="status" id="status">Selected: Left 7 Auto</div>
        </div>
      </div>
      <div class="panel list">
        <h2>Autonomous Routines</h2>
        <div class="list-box" id="listBox"></div>
      </div>
    </div>
    <div class="footer">This mirrors the intended selector behavior on the V5 Brain screen.</div>
  </div>

  <script>
    const routines = [
      "Left 7 Auto", "Right 7 Auto", "Win Point Auto", "Left Elims Auto",
      "Right Elims Auto", "Tuning Auto", "Skills Auto", "Left Rush Auto",
      "Right Rush Auto", "Test Auto 10", "Test Auto 11", "Test Auto 12"
    ];

    let selectedIndex = 0;
    let confirmedIndex = -1;
    let confirmed = false;

    const listBox = document.getElementById('listBox');
    const status = document.getElementById('status');
    const confirmBtn = document.getElementById('confirmBtn');

    function renderList() {
      listBox.innerHTML = '';
      routines.forEach((name, index) => {
        const btn = document.createElement('button');
        btn.className = 'item';
        if (index === selectedIndex) btn.classList.add('selected');
        if (confirmed && index === confirmedIndex) {
          btn.classList.remove('selected');
          btn.classList.add('confirmed');
        }
        btn.textContent = name;
        btn.disabled = confirmed;
        btn.onclick = () => {
          if (confirmed) return;
          selectedIndex = index;
          status.textContent = `Selected: ${routines[selectedIndex]}`;
          renderList();
        };
        listBox.appendChild(btn);
      });
    }

    confirmBtn.onclick = () => {
      if (confirmed) return;
      confirmed = true;
      confirmedIndex = selectedIndex;
      confirmBtn.disabled = true;
      status.textContent = `Running autonomous ${routines[confirmedIndex]}`;
      renderList();
    };

    let t = 0;
    setInterval(() => {
      t += 0.04;
      const x = (Math.sin(t) * 12).toFixed(2);
      const y = (Math.cos(t * 0.7) * 18).toFixed(2);
      const theta = ((t * 22) % 360).toFixed(2);
      document.getElementById('x').textContent = `X: ${x}`;
      document.getElementById('y').textContent = `Y: ${y}`;
      document.getElementById('theta').textContent = `Theta: ${theta}`;
    }, 60);

    renderList();
  </script>
</body>
</html>
